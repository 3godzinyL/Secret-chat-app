global
    daemon
    maxconn 2048

defaults
    mode http
    timeout connect 5s
    timeout client  50s
    timeout server  50s

# Base on 80
frontend fe_base
    bind *:80
    default_backend be_node

# ANY key-port range (10000-65535) — haproxy supports port ranges
frontend fe_keys
    bind *:10000-65535
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    default_backend be_node

backend be_node
    server node1 127.0.0.1:3000