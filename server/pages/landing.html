<!doctype html><html lang="pl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Umbra • Wejście</title>
<style>
  :root{--ink:#0a0a0a;--wine:#180a10;--crimson:#b5174a;--mist:#f3f0f6}
  *{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,var(--ink),var(--wine));color:var(--mist);font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:24px}
  .card{background:rgba(0,0,0,.5);border:1px solid rgba(181,23,74,.4);border-radius:16px;backdrop-filter:blur(6px);box-shadow:0 0 40px rgba(181,23,74,.18);padding:18px}
  .muted{opacity:.9} a{color:#ff7aa7}
</style></head><body>
<div class="wrap">
  <div class="card">
    <h1>Umbra</h1>
    <p class="muted">To jest <b>basic link</b>. Bez specjalnego zaproszenia nie wejdziesz do aplikacji.</p>
    <p class="muted">Masz zaproszenie? Użyj adresu w formie <code>http://localhost:*****</code> lub ścieżki <code>http://localhost/*****</code> (***** = 5-cyfrowy klucz).</p>
    <p class="muted">Panel administracyjny: <a href="/panel">/panel</a></p>
  </div>
</div>
</body></html>
